description: 'Lyra Collective is a consumer-products holding company that owns and operates a portfolio
  of everyday care brands across skincare, feminine care, and family and pet products, including LOLA,
  EVER, QRX Labs, TriLASTIN, Nuvadermis, Natemia, Leash Boss, and Lusso Gear. It positions itself around
  "Exceptional Care, For Everyday Moments," emphasizing clean, quality essentials sold direct-to-consumer
  and through retail. Surfaced as a portfolio company of Norwest Venture Partners and added to the API
  Evangelist network. As a consumer-brands operator it publishes no public developer portal, API, or
  API documentation; there is no API surface to enrich.'
